<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCX - Earn Crypto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e1a;color:#fff;min-height:100vh;padding:20px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:42px;color:#00ff88;text-shadow:0 0 20px #00ff88}
.balance-card{background:linear-gradient(135deg,#00ff88,#00ccff);border-radius:20px;padding:25px;text-align:center;margin:20px auto;max-width:400px;color:#000}
.balance-card h2{font-size:18px;opacity:0.8}
.balance-card .amount{font-size:48px;font-weight:bold;margin:10px 0}
.ad-card{background:#151a2c;border:1px solid #222;border-radius:16px;padding:20px;margin:15px auto;max-width:400px}
.ad-card h3{margin-bottom:12px}
.btn{width:100%;padding:15px;background:#00ff88;color:#000;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn:disabled{background:#333;color:#888}
.btn:hover:not(:disabled){background:#00e67a}
.small{font-size:12px;opacity:0.6;text-align:center;margin-top:15px}
</style>

<body>

<div class="header">
<h1>DCX</h1>
<p>Earn DCX by Watching Ads</p>
</div>

<div class="balance-card">
<h2>Your Balance</h2>
<div class="amount" id="balance">0</div>
<div>DCX Tokens</div>
</div>

<div class="ad-card">
<h3>💰 Watch & Earn</h3>
<p style="font-size:13px;opacity:0.7">Watch ad for 12s = 50 DCX. Adsterra pays you per click.</p>
<button class="btn" id="watchBtn1" onclick="watchAd(1)">Watch Ad 1 (+50 DCX)</button>
<button class="btn" id="watchBtn2" onclick="watchAd(2)">Watch Ad 2 (+50 DCX)</button>
<button class="btn" id="watchBtn3" onclick="watchAd(3)">Watch Ad 3 (+50 DCX)</button>
</div>

<div class="ad-card">
<h3>🎁 Daily Bonus</h3>
<button class="btn" onclick="dailyBonus()">Claim Daily 100 DCX</button>
</div>

<p class="small">Ads by Adsterra - You earn $0.03 per view + DCX users earn too<br>dco-lhpp.onrender.com is Active and Approved ✓</p>

<script>
// ===== BALANCE SYSTEM =====
let balance = parseInt(localStorage.getItem('dcx_balance') || '0');
document.getElementById('balance').innerText = balance;

function addReward(amount){
  balance += amount;
  localStorage.setItem('dcx_balance', balance);
  document.getElementById('balance').innerText = balance;
}

function dailyBonus(){
  let last = localStorage.getItem('dcx_daily');
  let now = Date.now();
  if(last && now - parseInt(last) < 86400000){
    alert('Come back tomorrow!');
    return;
  }
  localStorage.setItem('dcx_daily', now);
  addReward(100);
  alert('+100 DCX Added!');
}

// ===== ADSTERRA SMARTLINK - FOR ALL WATCH BUTTONS =====
const ADSTERRA_SMARTLINK = "https://cowardrainbowactual.com/b2yvpx40r?key=41a4beca48aef540235ec8094d30edc2";

function watchAd(num){
  // YOU EARN MONEY HERE
  window.open(ADSTERRA_SMARTLINK, '_blank');
  
  let btn = document.getElementById('watchBtn'+num);
  let c = 12;
  btn.disabled = true;
  btn.innerText = c + "s wait...";
  
  let t = setInterval(()=>{
    c--;
    btn.innerText = c + "s wait...";
    if(c <= 0){
      clearInterval(t);
      btn.innerText = "Claimed +50 DCX ✓";
      addReward(50);
      setTimeout(()=>{
        btn.innerText = "Watch Ad "+num+" (+50 DCX)";
        btn.disabled = false;
      }, 2500);
    }
  }, 1000);
}
</script>
