<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyCrypto - Earn 500 DCX Daily</title>

<!-- PASTE YOUR MONETAG VIGNETTE / ONCLICK CODE HERE -->
<!-- Example: <script src="https://..."></script> -->

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:#080b0f;color:white;min-height:100vh;padding:16px}
.container{max-width:420px;margin:auto}
.logo{font-size:42px;font-weight:900;text-align:center;margin:25px 0 5px;background:linear-gradient(90deg,#00ff9d,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#8a8f98;text-align:center;margin-bottom:25px;font-size:14px;letter-spacing:0.5px}
.card{background:linear-gradient(145deg,#11151c,#0e131a);border:1px solid #1c242f;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.balance-label{color:#8a8f98;text-align:center;font-size:13px;margin-bottom:8px}
.balance{color:#00ff88;font-size:48px;font-weight:900;text-align:center;letter-spacing:-1px}
.stats{display:flex;justify-content:space-between;margin-top:15px;color:#5a6270;font-size:13px}
.stats b{color:white}
.claim-card{border:1px solid #00ff88;background:radial-gradient(circle at top,#102a1f,#0e131a)}
.claim-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:5px}
.claim-sub{font-size:12px;color:#8a8f98;text-align:center;margin-bottom:18px}
.ad-row{display:flex;gap:10px;margin-bottom:12px}
.ad-btn{flex:1;background:#1a232f;border:1px solid #2a3545;color:white;padding:14px;border-radius:12px;font-weight:600;cursor:pointer;transition:0.3s;font-size:13px}
.ad-btn.watched{background:#00ff88;color:#002211;border-color:#00ff88}
.ad-btn:disabled{opacity:0.6}
#claimBtn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;transition:0.3s;margin-top:10px}
#claimBtn:disabled{background:#1a232f;color:#4a5568}
#claimBtn.active{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#00120a;box-shadow:0 0 20px rgba(0,255,136,0.4)}
.ads-box{background:#0c1017;border:1px dashed #1e2936;border-radius:14px;min-height:250px;display:flex;align-items:center;justify-content:center;color:#2d3748;font-size:11px;letter-spacing:2px;margin-bottom:16px;flex-direction:column;overflow:hidden}
.wallet-btn{width:100%;background:transparent;border:1.5px solid #00ff88;color:#00ff88;padding:16px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.small{font-size:11px;color:#4a5568;text-align:center;margin-top:18px;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:white;color:black;padding:14px 22px;border-radius:30px;font-weight:700;font-size:14px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
</style>
</head>
<body>
<div class="container">
<div class="logo">DailyCrypto</div>
<div class="sub">Watch Ads. Earn 500 DCX. Withdraw Monthly.</div>

<div class="card">
<div class="balance-label">Your Balance</div>
<div class="balance"><span id="bal">0</span> DCX</div>
<div class="stats"><span>Days: <b id="days">0/30</b></span><span id="usd">≈ $0.00</span></div>
</div>

<div class="card claim-card">
<div class="claim-title">Daily Reward: 500 DCX</div>
<div class="claim-sub" id="claimSub">Watch 2 ads to unlock today's claim</div>

<div class="ad-row">
<button class="ad-btn" id="ad1Btn" onclick="watchAd(1)">▶️ Watch Ad 1</button>
<button class="ad-btn" id="ad2Btn" onclick="watchAd(2)">▶️ Watch Ad 2</button>
</div>

<button id="claimBtn" disabled onclick="claim()">🔒 Watch Ads to Claim</button>
<div style="font-size:11px;color:#6b7280;text-align:center;margin-top:10px" id="timer"></div>
</div>

<!-- AD SPACE 1 - BANNER / MULTITAG -->
<div class="ads-box" id="adBox1">
SPONSORED
<!-- PASTE YOUR MONETAG BANNER CODE HERE FOR AD 1 -->
<!-- e.g. <div id="banner1"></div> -->
</div>

<!-- AD SPACE 2 - BANNER / NATIVE -->
<div class="ads-box" id="adBox2">
SPONSORED
<!-- PASTE YOUR MONETAG BANNER CODE HERE FOR AD 2 -->
</div>

<button class="wallet-btn" onclick="comingSoon()">Connect Wallet</button>
<p class="small">No wallet needed to earn. Connect only for monthly withdrawal.<br>Daily claim resets every 24 hours. Must watch both ads.</p>
</div>

<div class="toast" id="toast"></div>

<script>
let balance = parseInt(localStorage.getItem('dcx_bal') || '0');
let daysCount = parseInt(localStorage.getItem('dcx_days') || '0');
let lastClaim = localStorage.getItem('dcx_last') || '';
let ad1 = false, ad2 = false;

function init(){
  document.getElementById('bal').innerText = balance;
  document.getElementById('days').innerText = daysCount + '/30';
  document.getElementById('usd').innerText = '≈ $' + (balance*0.002).toFixed(2);
  
  let today = new Date().toDateString();
  if(lastClaim === today){
    document.getElementById('claimSub').innerText = '✅ Already claimed today. Come back tomorrow!';
    document.getElementById('claimBtn').innerText = '✅ Claimed Today';
    document.getElementById('timer').innerText = 'Next claim in: tomorrow';
  } else {
    // reset ads for new day
    ad1 = false; ad2 = false;
  }
  checkUnlock();
}

function watchAd(n){
  // THIS IS WHERE YOUR MONETAG AD WILL SHOW
  // If you use OnClick/Popunder, it will auto trigger on click
  showToast('Ad '+n+' playing... Watch to the end');
  
  // Simulate ad watch - in real life, user sees your Monetag ad
  setTimeout(()=>{
    if(n===1){
      ad1=true;
      document.getElementById('ad1Btn').classList.add('watched');
      document.getElementById('ad1Btn').innerText = '✅ Ad 1 Watched';
    } else {
      ad2=true;
      document.getElementById('ad2Btn').classList.add('watched');
      document.getElementById('ad2Btn').innerText = '✅ Ad 2 Watched';
    }
    checkUnlock();
    showToast('Ad '+n+' completed ✅');
  }, 2500);
  
  // OPTIONAL: Open your Monetag direct link here if you have it
  // window.open('YOUR_MONETAG_DIRECT_LINK', '_blank');
}

function checkUnlock(){
  let today = new Date().toDateString();
  if(lastClaim === today) return;
  if(ad1 && ad2){
    let btn = document.getElementById('claimBtn');
    btn.disabled = false;
    btn.classList.add('active');
    btn.innerText = '⚡ Claim 500 DCX Now';
    document.getElementById('claimSub').innerText = 'Ready to claim!';
  }
}

function claim(){
  let today = new Date().toDateString();
  if(lastClaim === today){ showToast('You already claimed today!'); return; }
  if(!ad1 || !ad2){ showToast('Watch both ads first!'); return; }
  
  balance += 500;
  daysCount++;
  lastClaim = today;
  localStorage.setItem('dcx_bal', balance);
  localStorage.setItem('dcx_days', daysCount);
  localStorage.setItem('dcx_last', today);
  
  document.getElementById('bal').innerText = balance;
  document.getElementById('days').innerText = daysCount + '/30';
  document.getElementById('usd').innerText = '≈ $' + (balance*0.002).toFixed(2);
  
  showToast('🎉 500 DCX Claimed! Balance: ' + balance);
  document.getElementById('claimBtn').innerText = '✅ Claimed Today';
  document.getElementById('claimBtn').disabled = true;
  document.getElementById('claimBtn').classList.remove('active');
  document.getElementById('claimSub').innerText = '✅ Already claimed today. Come back tomorrow!';
}

function comingSoon(){ showToast('🔜 Connect Wallet - Coming Soon!'); }
function showToast(m){ let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }

init();
</script>
</body>
  </html>
