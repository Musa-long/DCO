<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCX - Earn Crypto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#070a14;color:#fff}
.box{max-width:430px;margin:auto;padding:15px}
.card{background:#12172a;border:1px solid #222;border-radius:16px;padding:18px;margin:12px 0}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#0c1020;color:#fff;outline:none}
input:focus{border-color:#00ff88}
.btn{width:100%;padding:14px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:bold;margin:6px 0;cursor:pointer}
.btn:disabled{background:#222;color:#555}
.btn-check{background:#00ff88;color:#000;padding:12px 18px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;margin-left:8px}
.bal{font-size:42px;color:#00ff88;text-align:center;font-weight:bold}
.row{display:flex;align-items:center;margin:8px 0}
.partner-img{width:100%;border-radius:12px;margin-top:10px;border:1px solid #222}
.wallet-input{display:none}
</style>
</head>
<body>
<div class="box">
<h1 style="text-align:center;color:#00ff88;margin:10px">DCX</h1>

<div class="card">
<b>👤 Profile</b>
<div class="row">
<input id="name" placeholder="Your Name">
</div>
<div class="row">
<input id="email" placeholder="Your Email">
<button class="btn-check" onclick="saveProfile()">✓</button>
</div>
<div id="savedMsg" style="font-size:11px;color:#00ff88;display:none;margin-top:6px"></div>
</div>

<div class="card" style="text-align:center;background:linear-gradient(135deg,#00ff88,#00d4ff);color:#000">
<div class="bal" id="bal" style="color:#000">0 DCX</div>
<div id="daily" style="font-size:13px">0 / 150 DCX Today</div>
<div style="background:rgba(0,0,0,0.2);height:8px;border-radius:10px;margin-top:8px"><div id="bar" style="height:100%;background:#000;width:0%;border-radius:10px;transition:0.4s"></div></div>
</div>

<div class="card">
<button class="btn" id="btn1" onclick="watchAd(1)">Watch Ad 1 (+50 DCX)</button>
<button class="btn" id="btn2" onclick="watchAd(2)">Watch Ad 2 (+50 DCX)</button>
<button class="btn" id="btn3" onclick="watchAd(3)">Watch Ad 3 (+50 DCX)</button>
</div>

<div class="card"><div id="hist" style="font-size:12px;opacity:0.7">No earnings yet</div></div>

<div class="card" style="text-align:center">
<b>🤝 Our Partners</b>
<img src="partners.png" class="partner-img" alt="Binance Bybit Coinbase">
<p style="font-size:10px;opacity:0.4;margin-top:8px">DCX will be listed on Binance • Bybit • Coinbase soon</p>
</div>

<div class="card" id="walletCard" style="text-align:center">
<b>🔗 Connect Wallet</b>
<div id="walletArea" class="wallet-input" style="margin-top:10px">
<input id="walletAddr" placeholder="Paste BEP20 Wallet Address (0x...)">
<button class="btn" style="background:#1a2340;color:#888;border:1px dashed #444" onclick="alert('Wallet Withdraw Coming Soon! Min 1000 DCX')">Claim to Wallet - Coming Soon</button>
</div>
<button id="showWalletBtn" class="btn" style="background:#1a2340;color:#fff;margin-top:10px" onclick="showWallet()">Connect Wallet</button>
</div>

</div>
<script>
function today(){return new Date().toDateString()}
function isAdDone(n){return localStorage.getItem('ad'+n+'_date')===today()}
function setAdDone(n){localStorage.setItem('ad'+n+'_date',today())}
function getD(){if(localStorage.getItem('d_date')!==today()){localStorage.setItem('d_date',today());localStorage.setItem('d_daily','0');[1,2,3].forEach(i=>localStorage.removeItem('ad'+i+'_date'));return 0}return parseInt(localStorage.getItem('d_daily')||'0')}
function setD(v){localStorage.setItem('d_date',today());localStorage.setItem('d_daily',v)}
function saveProfile(){
let n=document.getElementById('name').value.trim();
let e=document.getElementById('email').value.trim();
if(!n||!e||!e.includes('@')){alert('Enter valid Name and Email');return}
localStorage.setItem('dcx_name',n);localStorage.setItem('dcx_email',e);
let m=document.getElementById('savedMsg');m.style.display='block';m.innerText='✓ Saved as '+n+' - Verified';
setTimeout(()=>m.style.display='none',3000);
}
function update(){
let b=parseInt(localStorage.getItem('dcx_balance')||'0');
document.getElementById('bal').innerText=b+' DCX';
document.getElementById('daily').innerText=getD()+' / 150 DCX Today (3 ads max = Adsterra limit)';
document.getElementById('bar').style.width=(getD()/150*100)+'%';
[1,2,3].forEach(i=>{let btn=document.getElementById('btn'+i);if(isAdDone(i)){btn.disabled=true;btn.innerText='Ad '+i+' - Claimed Today ✓'}else{btn.disabled=false;btn.innerText='Watch Ad '+i+' (+50 DCX)'}});
let h=JSON.parse(localStorage.getItem('dcx_h')||'[]');
document.getElementById('hist').innerHTML=h.length?h.slice(-10).reverse().join('<br>'):'No earnings yet';
document.getElementById('name').value=localStorage.getItem('dcx_name')||'';document.getElementById('email').value=localStorage.getItem('dcx_email')||'';
}
function add(a,r){let b=parseInt(localStorage.getItem('dcx_balance')||'0')+a;localStorage.setItem('dcx_balance',b);setD(getD()+a);let h=JSON.parse(localStorage.getItem('dcx_h')||'[]');h.push('+'+a+' DCX Ad'+r+' '+new Date().toLocaleTimeString());localStorage.setItem('dcx_h',JSON.stringify(h));update();showWalletAfterClaim()}
function showWallet(){document.getElementById('walletArea').style.display='block';document.getElementById('showWalletBtn').style.display='none';}
function showWalletAfterClaim(){document.getElementById('walletArea').style.display='block';document.getElementById('showWalletBtn').style.display='none';document.getElementById('walletCard').scrollIntoView({behavior:'smooth'})}
const AD1="https://cowardrainbowactual.com/b2yvpx40r?key=41a4beca48aef540235ec8094d30edc2";
function watchAd(n){
if(!localStorage.getItem('dcx_name')){alert('Please enter Name and Email and press ✓ first');return}
if(isAdDone(n)){alert('Ad '+n+' already watched today');return}
window.open(AD1,'_blank');
let btn=document.getElementById('btn'+n),c=12;btn.disabled=true;btn.innerText=c+'s...';
let t=setInterval(()=>{c--;btn.innerText=c+'s...';if(c<=0){clearInterval(t);setAdDone(n);add(50,n);btn.innerText='Ad '+n+' - Claimed ✓'}},1000);
}
update();
</script>
<script src="https://cowardrainbowactual.com/fc/ed/85/fced858ef838a14b12551c52e3a659d3.js"></script>
<script src="https://cowardrainbowactual.com/0a/18/37/0a1837fb9737e516baab2f090f80491c.js"></script>
</body>
</html>
